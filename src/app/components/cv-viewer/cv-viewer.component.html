<div *ngIf="isOpen" class="cv-viewer" role="dialog" aria-modal="true" [attr.aria-label]="'cv.viewerTitle' | translate">
  <header class="cv-viewer-toolbar">
    <div class="cv-viewer-toolbar__title">
      <i class="bi bi-file-earmark-person-fill" aria-hidden="true"></i>
      <span>{{ 'cv.viewerTitle' | translate }}</span>
    </div>

    <div class="cv-viewer-zoom" role="group" [attr.aria-label]="'cv.zoom' | translate">
      <button type="button" class="cv-viewer-zoom__step" (click)="zoom('out')" [disabled]="!zoomReady || zoomPercent <= 25" [attr.aria-label]="'cv.zoomOut' | translate">−</button>
      <output class="cv-viewer-zoom__value" aria-live="polite">{{ zoomReady ? zoomPercent + '%' : '—' }}</output>
      <button type="button" class="cv-viewer-zoom__step" (click)="zoom('in')" [disabled]="!zoomReady || zoomPercent >= 400" [attr.aria-label]="'cv.zoomIn' | translate">+</button>
      <button type="button" class="cv-viewer-zoom__fit" (click)="zoom('fit')" [disabled]="!zoomReady" [attr.aria-pressed]="zoomFit">{{ 'cv.fitWidth' | translate }}</button>
    </div>

    <div class="cv-viewer-toolbar__actions">
      <a class="cv-viewer-btn cv-viewer-btn--secondary cv-viewer-btn--open" [href]="pdfUrl" target="_blank" rel="noopener" [attr.aria-label]="'cv.openPdf' | translate">
        <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
        <span>{{ 'cv.openPdf' | translate }}</span>
      </a>
      <button type="button" class="cv-viewer-btn cv-viewer-btn--secondary" (click)="changeLanguage()" [attr.aria-label]="'cv.changeLanguage' | translate">
        <i class="bi bi-translate" aria-hidden="true"></i>
        <span>{{ 'cv.changeLanguage' | translate }}</span>
      </button>

      <button type="button" class="cv-viewer-btn cv-viewer-btn--secondary" (click)="downloadCv()" [attr.aria-label]="'cv.download' | translate">
        <i class="bi bi-download" aria-hidden="true"></i>
        <span>{{ 'cv.download' | translate }}</span>
      </button>

      <button
        type="button"
        class="cv-viewer-btn cv-viewer-btn--primary"
        (click)="close()"
        [attr.aria-label]="'cv.close' | translate"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
        <span>{{ 'cv.close' | translate }}</span>
      </button>
    </div>
  </header>

  <div class="cv-viewer-body">
    <img *ngIf="previewUrl && !previewComplete" class="cv-viewer-preview" [src]="previewUrl" alt="" aria-hidden="true" />
    <iframe
      #pdfFrame
      *ngIf="safePdfUrl"
      class="cv-viewer-frame"
      [src]="safePdfUrl"
      [title]="'cv.viewerTitle' | translate"
    ></iframe>
  </div>
</div>
