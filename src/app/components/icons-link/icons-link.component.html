<div class="icons">
  <div class="icons-inner">
    <div class="icons-group icons-group--with-line">
    <ul>
      <li>
        <a
          class="icon-link-has-tooltip"
          data-tooltip="LinkedIn"
          aria-label="Visit my LinkedIn profile"
          target="_blank"
          rel="noopener noreferrer"
          href="https://www.linkedin.com/in/hakim-mezrioui"
        >
          <i class="bi bi-linkedin"></i>
        </a>
      </li>
      <li>
        <a
          class="icon-link-has-tooltip"
          data-tooltip="GitHub"
          aria-label="Visit my GitHub profile"
          target="_blank"
          rel="noopener noreferrer"
          href="https://github.com/Hakim2Mezrioui"
        >
          <i class="bi bi-github"></i>
        </a>
      </li>
      <li>
        <button
          type="button"
          class="icon-link-btn icon-link-has-tooltip"
          [attr.data-tooltip]="'cv.tooltip' | translate"
          [attr.aria-label]="'cv.ariaOpen' | translate"
          (click)="openCvModal()"
        >
          <i class="bi bi-file-earmark-person-fill"></i>
        </button>
      </li>
    </ul>
  </div>
  <a
    class="icon-link icon-link--email icon-link-has-tooltip"
    data-tooltip="Send email"
    aria-label="Send me an email"
    target="_blank"
    rel="noopener noreferrer"
    href="mailto:mezrioui.hakim@gmail.com"
  >
    <i class="bi bi-envelope-fill"></i>
  </a>
  </div>
</div>
